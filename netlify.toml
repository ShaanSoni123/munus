# Netlify Configuration for Munus

[build]
  publish = "dist"
  command = "npm run build"

# Redirects for React Router (SPA)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Specific redirects for OAuth callback
[[redirects]]
  from = "/google-callback"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/role-selection"
  to = "/index.html"
  status = 200

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"



